<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#27272a" stroke-width="6"/>

  <!-- Subtle glow backdrop -->
  <circle cx="256" cy="256" r="170" fill="url(#glow)"/>

  <!-- Barbell Plates Left -->
  <rect x="90" y="196" width="28" height="120" rx="8" fill="#22c55e"/>
  <rect x="126" y="166" width="34" height="180" rx="10" fill="url(#primaryGrad)"/>

  <!-- Barbell Plates Right -->
  <rect x="394" y="196" width="28" height="120" rx="8" fill="#22c55e"/>
  <rect x="352" y="166" width="34" height="180" rx="10" fill="url(#primaryGrad)"/>

  <!-- Barbell Central Shaft -->
  <rect x="156" y="244" width="200" height="24" rx="6" fill="#e4e4e7"/>

  <!-- Center Heartbeat / Cardio Pulse overlay -->
  <path d="M190 256 L220 256 L238 206 L262 310 L280 236 L294 270 L308 256 L330 256" 
        fill="none" 
        stroke="#4ade80" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Activity Heatmap Mini Grid at Bottom -->
  <g transform="translate(166, 380)">
    <rect x="0" y="0" width="30" height="30" rx="6" fill="#15803d"/>
    <rect x="38" y="0" width="30" height="30" rx="6" fill="#22c55e"/>
    <rect x="76" y="0" width="30" height="30" rx="6" fill="#15803d"/>
    <rect x="114" y="0" width="30" height="30" rx="6" fill="#4ade80"/>
    <rect x="152" y="0" width="30" height="30" rx="6" fill="#15803d"/>
  </g>
</svg>
